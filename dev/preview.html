<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音乐插件 · 本地预览</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    background: #eef0f3; color: #1d1d1f;
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .bar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 14px 18px; width: 100%; max-width: 820px;
  }
  .bar__title { font-weight: 600; margin-right: auto; }
  .bar button, .bar select {
    font: 13px/1.4 inherit; padding: 6px 10px; border-radius: 8px;
    border: 1px solid #d5d8dd; background: #fff; color: #333; cursor: pointer;
  }
  .bar button:active { background: #f3f4f6; }
  .bar label { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: #666; cursor: pointer; }
  .stage { display: flex; gap: 26px; align-items: flex-start; padding: 10px 18px 40px; flex-wrap: wrap; justify-content: center; }
  .phone {
    width: 390px; height: 844px; background: #fff; border-radius: 34px;
    box-shadow: 0 24px 60px rgba(0,0,0,.18), 0 0 0 10px #1b1d22;
    overflow: hidden; position: relative;
  }
  .phone__notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 108px; height: 22px; background: #1b1d22; border-radius: 999px; z-index: 5;
  }
  #mount { width: 100%; height: 100%; overflow: hidden; }
  .side { width: 300px; display: flex; flex-direction: column; gap: 10px; }
  .side h2 { font-size: 13px; margin: 0; color: #6b7280; font-weight: 600; }
  .cardbox { background: #fff; border: 1px dashed #cfd4da; border-radius: 12px; padding: 12px; min-height: 70px; }
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #1b1d22; color: #fff; font-size: 12.5px; padding: 8px 14px;
    border-radius: 999px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 999;
  }
  #err {
    position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%);
    max-width: 680px; background: #2b1414; color: #ffb4b4; border: 1px solid #5a2626;
    padding: 10px 14px; border-radius: 10px; font: 12px/1.5 ui-monospace, Consolas, monospace;
    white-space: pre-wrap; display: none; z-index: 99;
  }
  .tip { width: 100%; max-width: 820px; padding: 0 18px 24px; color: #8a8f98; font-size: 12px; }
</style>
</head>
<body>
  <div class="bar">
    <div class="bar__title">音乐插件 · 本地预览</div>
    <select id="appSel"></select>
    <button id="reload">重载</button>
    <button id="clear">清空模拟存储</button>
    <button id="minimize">模拟最小化</button>
    <label><input type="checkbox" id="mockAudio" checked> 假音频</label>
    <label><input type="checkbox" id="failSearch"> 搜索失败</label>
  </div>

  <div class="stage">
    <div class="phone">
      <div class="phone__notch"></div>
      <div id="mount"></div>
    </div>
    <div class="side">
      <h2>聊天卡片预览</h2>
      <div class="cardbox" id="cardbox"></div>
      <h2>提示</h2>
      <div style="font-size:12px;color:#8a8f98;line-height:1.7">
        假宿主只用于看界面与交互。<br>
        真机上的 safe-area、音频播放、宿主卡片宽度需要自己验证。
      </div>
    </div>
  </div>

  <div class="tip">正式版需要先执行 npm run build 生成 plugin.js</div>
  <div id="toast"></div>
  <div id="err"></div>

  <script src="./mock-host.js"></script>
  <script>
    (function () {
      var errEl = document.getElementById('err');
      function showError(msg) {
        errEl.style.display = 'block';
        errEl.textContent = msg;
      }
      window.addEventListener('error', function (e) { showError('运行错误：' + e.message); });
      window.addEventListener('unhandledrejection', function (e) {
        showError('未处理的 Promise 拒绝：' + ((e.reason && e.reason.message) || e.reason));
      });

      var script = document.createElement('script');
      script.src = '../plugin.js';
      script.onerror = function () { showError('脚本加载失败：../plugin.js\n请先执行 npm run build'); };
      script.onload = boot;
      document.body.appendChild(script);

      function boot() {
        var mountEl = document.getElementById('mount');
        var appSel = document.getElementById('appSel');
        var current = null;

        function apps() {
          var p = window.__registeredPlugin;
          return (p && p.apps) || [];
        }

        async function mountApp(appId) {
          errEl.style.display = 'none';
          var list = apps();
          var app = list.filter(function (a) { return a.id === appId; })[0] || list[0];
          if (!app) { showError('没有找到已注册的 App'); return; }
          try {
            if (current && current.unmount) await current.unmount(mountEl, window.roche);
            mountEl.replaceChildren();
          } catch (e) { showError('卸载失败：' + e.message); }
          current = app;
          try {
            await app.mount(mountEl, window.roche);
          } catch (e) {
            showError('挂载失败：' + e.message + '\n' + (e.stack || ''));
          }
        }

        function fillSelect() {
          var list = apps();
          appSel.innerHTML = '';
          list.forEach(function (a) {
            var o = document.createElement('option');
            o.value = a.id;
            o.textContent = a.name + '（' + a.id + '）';
            appSel.appendChild(o);
          });
        }

        function renderCardDemo() {
          var p = window.__registeredPlugin;
          var types = (p && p.chat && p.chat.messageTypes) || [];
          if (!types.length) return;
          var box = document.getElementById('cardbox');
          box.innerHTML = '';
          types[0].mount(box, {
            id: 'mock-msg',
            conversationId: 'conv-1',
            cardData: {
              track: { source: 'gd', platform: 'netease', id: 'mock-0', name: '晴天', artist: '周杰伦' },
              status: 'invite'
            }
          }, window.roche);
        }

        appSel.addEventListener('change', function () { mountApp(appSel.value); });
        document.getElementById('reload').addEventListener('click', function () { location.reload(); });
        document.getElementById('clear').addEventListener('click', function () {
          window.__mock.clear();
          location.reload();
        });
        document.getElementById('minimize').addEventListener('click', function () {
          if (window.roche.ui.minimizeApp) window.roche.ui.minimizeApp();
        });
        document.getElementById('mockAudio').addEventListener('change', function (e) {
          window.__mock.settings.mockAudio = e.target.checked;
        });
        document.getElementById('failSearch').addEventListener('change', function (e) {
          window.__mock.settings.failSearch = e.target.checked;
        });

        fillSelect();
        mountApp(appSel.value);
        renderCardDemo();
      }
    })();
  </script>
</body>
</html>
